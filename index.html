<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakura Restaurant</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      padding: 0;
    }

    header {
      background: #b30000;
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav {
      background: #222;
      padding: 10px;
      text-align: center;
    }

    nav a {
      color: white;
      margin: 10px;
      text-decoration: none;
    }

    .container {
      padding: 20px;
    }

    .menu img {
      width: 100%;
      max-width: 300px;
      margin: 10px;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .gallery img {
      width: 30%;
      min-width: 200px;
    }

    .btn {
      background: green;
      color: white;
      padding: 10px 20px;
      text-decoration: none;
      display: inline-block;
      margin-top: 10px;
    }

    footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 10px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>🍣 Sakura Restaurant</h1>
  <p>Welcome to our restaurant</p>
</header>

<nav>
  <a href="#menu">Menu</a>
  <a href="#gallery">Gallery</a>
  <a href="#booking">Booking</a>
  <a href="#contact">Contact</a>
</nav>

<div class="container">

  <h2 id="menu">🍜 Menu</h2>
  <p>Our delicious food items</p>

  <div class="menu">
    <img src="images/food1.jpg">
    <img src="images/food2.jpg">
    <img src="images/food3.jpg">
  </div>

  <h2 id="gallery">📸 Gallery</h2>
  <div class="gallery">
    <img src="images/food1.jpg">
    <img src="images/food2.jpg">
    <img src="images/food3.jpg">
  </div>

  <h2 id="booking">📅 Book a Table</h2>
  <p>Reserve your table online</p>

  <iframe 
    src="https://docs.google.com/forms/d/e/1FAIpQLSf2Xg8EzE3PhjD6ApwOjse8sXasw1fA1y_ezUNYxRYAaJm2rA/viewform?embedded=true"
    width="100%" 
    height="700">
  </iframe>

  <h2 id="contact">📞 Contact</h2>
  <p>Call us: +81-90-XXXX-XXXX</p>

  <a class="btn" href="#booking">Book Now</a>

</div>

<footer>
  <p>© 2026 Sakura Restaurant</p>
</footer>

</body>
</html>
